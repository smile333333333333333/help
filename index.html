canvas{

}

#death{
    position:fixed;

    color:#ddd;

}

#death button{

    color:white;

    font-family:monospace;
}
</style>
</head>

<p>Choose what is hunting you.</p>

<div class="modes">

<b>SLASHER</b>
A masked human pursuer.
</button>

<button class="mode" id="stalkerBtn">
<b>STALKER</b>
Quiet and patient.
</button>

<button class="mode" id="creatureBtn">
<b>CREATURE</b>
Something unnatural.
</button>

<button class="mode" id="bodyBtn">
<b>BODY HORROR</b>
A constantly changing creature.
</button>

<button class="mode" id="supernaturalBtn">
<b>SUPERNATURAL</b>
The cabin itself is strange.
</button>

<button class="mode" id="survivalBtn">
<b>SURVIVAL</b>
The hardest mode.
</button>

</div>
</div>

<canvas id="game"></canvas>

<div id="help">
WASD / ARROWS = MOVE &nbsp;&nbsp; E = INTERACT &nbsp;&nbsp; SHIFT = RUN
</div>

<div id="death">

<h1>CAUGHT</h1>

<p>You didn't make it out.</p>

<button id="retryBtn">TRY AGAIN</button>

</div>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=1000;
canvas.height=600;


/* =========================
   INPUT
========================= */

const keys={};

document.addEventListener("keydown",function(e){

    keys[e.key.toLowerCase()]=true;

    if(e.key.toLowerCase()==="e"){
        interact();
    }

});

document.addEventListener("keyup",function(e){

    keys[e.key.toLowerCase()]=false;

});

========================= */

let room=0;

let messageTimer=0;

let caught=false;

let items=[];

/* =========================

========================= */

const enemy={

    speed:.7,
    active:false
};


/* =========================

],

/* =========================
   START GAME
========================= */

function startGame(selected){

    mode=selected;

    document.getElementById("modeScreen").style.display="none";

    running=true;

    caught=false;

    room=0;

    player.x=150;
    player.y=300;

    inventory=[];

    lockedDoors={};

    hiding=false;

    /* copy item lists */

    items=rooms.map(function(r){

        return r.items.map(function(item){

            return {
                x:item.x,
                y:item.y,
                name:item.name,
                id:item.id
            };

        });

    });


    if(mode==="slasher"){
        enemy.speed=.72;
    }

    else if(mode==="stalker"){
        enemy.speed=.48;
    }

    else if(mode==="creature"){
        enemy.speed=.9;
    }

    else if(mode==="body"){
        enemy.speed=.75;
    }

    else if(mode==="supernatural"){
        enemy.speed=.65;
    }

    else if(mode==="survival"){
        enemy.speed=1.05;
    }


    enemy.x=850;
    enemy.y=300;
    enemy.active=true;

    showMessage(
        "Find everything you need to escape.\n\nSomething is hunting you.",
        5
    );

}


/* =========================
   BUTTONS
========================= */

document.getElementById("slasherBtn")
.addEventListener("click",function(){
    startGame("slasher");
});

document.getElementById("stalkerBtn")
.addEventListener("click",function(){
    startGame("stalker");
});

document.getElementById("creatureBtn")
.addEventListener("click",function(){
    startGame("creature");
});

document.getElementById("bodyBtn")
.addEventListener("click",function(){
    startGame("body");
});

document.getElementById("supernaturalBtn")
.addEventListener("click",function(){
    startGame("supernatural");
});

document.getElementById("survivalBtn")
.addEventListener("click",function(){
    startGame("survival");
});

document.getElementById("retryBtn")
.addEventListener("click",function(){
    location.reload();
});


/* =========================
   MESSAGE
========================= */

function showMessage(text,time){

    const box=document.getElementById("message");

    box.textContent=text;

    box.style.display="block";

    messageTimer=time*60;

}


/* =========================
   INVENTORY
========================= */

function hasItem(id){

    return inventory.indexOf(id)!==-1;

}


function collectItem(index){

    const item=items[room][index];

    inventory.push(item.id);

    showMessage(
        "FOUND:\n"+item.name,
        2
    );

    items[room].splice(index,1);

}


/* =========================
   DOOR KEY
========================= */

function getDoorKey(d){

    return room+"_"+d.to;

}


function isLocked(d){

    return lockedDoors[getDoorKey(d)]===true;

}


/* =========================
   COLLISION
========================= */

function blocked(x,y){

    if(y<55 || y>565){
        return true;
    }


    if(x<35){

        for(const d of rooms[room].doors){

            if(
                d.x<100 &&
                Math.abs(y-(d.y+60))<90
            ){

                if(isLocked(d)){
                    return true;
                }

                return false;
            }

        }

        return true;
    }


    if(x>965){

        for(const d of rooms[room].doors){

            if(
                d.x>900 &&
                Math.abs(y-(d.y+60))<90
            ){

                if(isLocked(d)){
                    return true;
                }

                return false;
            }

        }

        return true;
    }


    /* top entrance */

    if(y<55){

        for(const d of rooms[room].doors){

            if(
                d.y<100 &&
                Math.abs(x-(d.x+25))<80
            ){

                return false;

            }

        }

        return true;

    }


    for(const f of rooms[room].furniture){

        if(
            x>f.x-10 &&
            x<f.x+f.w+10 &&
            y>f.y-10 &&
            y<f.y+f.h+10
        ){

            return true;

        }

    }

    return false;

}


/* =========================
   ROOM CHANGE
========================= */

function changeRoom(d,side){

    room=d.to;

    if(side==="right"){
        player.x=65;
        player.y=300;
    }

    else if(side==="left"){
        player.x=935;
        player.y=300;
    }

    else{
        player.x=500;
        player.y=500;
    }

    enemy.x=Math.random()*700+150;
    enemy.y=Math.random()*350+120;

    showMessage(
        rooms[room].name,
        1.5
    );

}


/* =========================
   UPDATE
========================= */

function update(){

    if(!running) return;


    if(hiding){

        if(keys["e"]){

            hiding=false;

            keys["e"]=false;

            showMessage(
                "You leave the hiding place.",
                2
            );

        }

        return;

    }


    let dx=0;
    let dy=0;

    if(keys["w"]||keys["arrowup"]) dy--;

    if(keys["s"]||keys["arrowdown"]) dy++;

    if(keys["a"]||keys["arrowleft"]) dx--;

    if(keys["d"]||keys["arrowright"]) dx++;


    if(dx!==0 && dy!==0){

        dx*=.707;
        dy*=.707;

    }


    let speed=player.speed;

    if(keys["shift"]){
        speed=4;
    }


    const nx=player.x+dx*speed;
    const ny=player.y+dy*speed;


    if(!blocked(nx,player.y)){
        player.x=nx;
    }

    if(!blocked(player.x,ny)){
        player.y=ny;
    }


    /* room exits */

    if(player.x>970){

        for(const d of rooms[room].doors){

            if(
                d.x>900 &&
                Math.abs(player.y-(d.y+60))<90
            ){

                if(!isLocked(d)){

                    changeRoom(d,"right");

                }

                break;

            }

        }

    }


    if(player.x<30){

        for(const d of rooms[room].doors){

            if(
                d.x<100 &&
                Math.abs(player.y-(d.y+60))<90
            ){

                if(!isLocked(d)){

                    changeRoom(d,"left");

                }

                break;

            }

        }

    }


    /* top/bottom special doors */

    if(player.y<25){

        for(const d of rooms[room].doors){

            if(d.y<100){

                changeRoom(d,"top");

                break;

            }

        }

    }


    /* enemy */

    updateEnemy();


    if(messageTimer>0){

        messageTimer--;

        if(messageTimer<=0){

            document.getElementById("message")
            .style.display="none";

        }

    }

}


/* =========================
   ENEMY
========================= */

function updateEnemy(){

    if(!enemy.active) return;


    let targetX=player.x;
    let targetY=player.y;


    if(mode==="stalker"){

        if(Math.random()<.015){

            targetX+=Math.random()*300-150;
            targetY+=Math.random()*300-150;

        }

    }


    if(mode==="supernatural"){

        if(Math.random()<.003){

            enemy.x=Math.random()*800+100;
            enemy.y=Math.random()*400+100;

        }

    }


    const dx=targetX-enemy.x;
    const dy=targetY-enemy.y;

    const distance=Math.hypot(dx,dy);


    if(distance>2){

        enemy.x+=dx/distance*enemy.speed;
        enemy.y+=dy/distance*enemy.speed;

    }


    if(distance<28){

        caughtPlayer();

    }

}


/* =========================
   CAUGHT
========================= */

function caughtPlayer(){

    if(hiding) return;

    running=false;

    document.getElementById("death")
    .style.display="flex";

}


/* =========================
   INTERACT
========================= */

function interact(){

    if(!running || hiding) return;


    /* items */

    for(let i=items[room].length-1;i>=0;i--){

        const item=items[room][i];

        const d=Math.hypot(
            player.x-item.x,
            player.y-item.y
        );

        if(d<60){

            collectItem(i);

            return;

        }

    }


    /* doors */

    for(const d of rooms[room].doors){

        const cx=d.x+25;
        const cy=d.y+60;

        const distance=Math.hypot(
            player.x-cx,
            player.y-cy
        );

        if(distance<100){

            const key=getDoorKey(d);

            lockedDoors[key]=!lockedDoors[key];

            if(lockedDoors[key]){

                showMessage(
                    "DOOR LOCKED",
                    2
                );

            }else{

                showMessage(
                    "DOOR UNLOCKED",
                    2
                );

            }

            return;

        }

    }


    /* hiding places */

    for(const h of rooms[room].hide){

        if(
            player.x>h.x-45 &&
            player.x<h.x+h.w+45 &&
            player.y>h.y-45 &&
            player.y<h.y+h.h+45
        ){

            hiding=true;

            showMessage(
                "You hide.\n\nPress E to leave.",
                2
            );

            return;

        }

    }


    /* garage escape */

    if(room===8){

        if(
            player.x>580 &&
            player.x<850 &&
            player.y>70 &&
            player.y<240
        ){

            escape();

            return;

        }

    }


    showMessage(
        "Nothing useful here.",
        2
    );

}


/* =========================
   ESCAPE
========================= */

function escape(){

    const needed=[
        "basement",
        "flashlight",
        "keys",
        "fuse",
        "cutters",
        "gas",
        "generator"
    ];

    let missing=[];

    for(const item of needed){

        if(!hasItem(item)){
            missing.push(item);
        }

    }


    if(missing.length===0){

        running=false;
        enemy.active=false;

        showMessage(
`THE ENGINE STARTS.

The cabin disappears
behind you.

YOU ESCAPED.

THE END`,
999
        );

    }else{

        showMessage(
            "The car isn't ready.\n\n"+
            "You still need "+missing.length+" items.",
            4
        );

    }

}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* background */

    ctx.fillStyle="#12100e";

    ctx.fillRect(
        0,
        0,
        1000,
        600
    );


    /* floor */

    ctx.fillStyle="#30271f";

    ctx.fillRect(
        35,
        50,
        930,
        515
    );


    /* floorboards */

    ctx.strokeStyle="#40352b";

    for(let y=75;y<560;y+=35){

        ctx.beginPath();

        ctx.moveTo(35,y);
        ctx.lineTo(965,y);

        ctx.stroke();

    }


    /* walls */

    ctx.fillStyle="#171310";

    ctx.fillRect(0,0,1000,50);
    ctx.fillRect(0,565,1000,35);

    ctx.fillRect(0,50,35,515);
    ctx.fillRect(965,50,35,515);


    /* doors */

    for(const d of rooms[room].doors){

        let x=d.x;

        if(x<100) x=0;
        if(x>900) x=950;

        if(d.y<100){

            x=d.x;

            ctx.fillStyle="#493b30";

            ctx.fillRect(
                x,
                0,
                50,
                50
            );

            continue;

        }


        ctx.fillStyle=
            isLocked(d)
            ? "#242424"
            : "#4a3a2e";

        ctx.fillRect(
            x,
            d.y,
            50,
            120
        );

        ctx.strokeStyle="#777";

        ctx.strokeRect(
            x,
            d.y,
            50,
            120
        );

        ctx.fillStyle="#aaa";

        ctx.font="10px monospace";

        ctx.textAlign="center";

        ctx.fillText(
            isLocked(d)?"LOCKED":"DOOR",
            x+25,
            d.y+62
        );

    }


    /* furniture */

    for(const f of rooms[room].furniture){

        ctx.fillStyle="#49392d";

        ctx.strokeStyle="#695546";

        ctx.fillRect(
            f.x,
            f.y,
            f.w,
            f.h
        );

        ctx.strokeRect(
            f.x,
            f.y,
            f.w,
            f.h
        );

        ctx.fillStyle="#aa917c";

        ctx.font="11px monospace";

        ctx.textAlign="center";

        ctx.fillText(
            f.n,
            f.x+f.w/2,
            f.y+f.h/2
        );

    }


    /* items */

    for(const item of items[room]){

        ctx.fillStyle="#d6bd55";

        ctx.beginPath();

        ctx.arc(
            item.x,
            item.y,
            8,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* enemy */

    if(enemy.active){

        if(mode==="slasher"){

            ctx.fillStyle="#151515";

            ctx.beginPath();

            ctx.arc(
                enemy.x,
                enemy.y,
                17,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#ddd";

            ctx.fillRect(
                enemy.x-9,
                enemy.y-5,
                18,
                11
            );

        }


        else if(mode==="stalker"){

            ctx.fillStyle="#080808";

            ctx.beginPath();

            ctx.arc(
                enemy.x,
                enemy.y,
                13,
                0,
                Math.PI*2
            );

            ctx.fill();
