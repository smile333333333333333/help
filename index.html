function showMessage(txt,seconds=4){

/* =========================================================
   ROOM MOVEMENT
========================================================= */

function enterRight(){

    if(room<rooms.length-1){

        room++;

        player.x=55;
        player.y=300;

        showMessage("ENTERED:\n\n"+rooms[room].name,1.5);

        if(room>=4 && !strangeEvent){
            strangeEvent=true;
        }

    }else{

        player.x=950;

    }

}


function enterLeft(){

    if(room>0){

        room--;

        player.x=945;
        player.y=300;

        showMessage("RETURNED TO:\n\n"+rooms[room].name,1.5);

    }else{

        player.x=50;

    }

}


/* =========================================================
   COLLISION
========================================================= */

function blocked(x,y){

    /* doorway openings */

    if(x<35){

        if(y>=225 && y<=375){
            return false;
        }

        return true;
    }

    if(x>965){

        if(y>=225 && y<=375){
            return false;
        }

        return true;
    }

    if(y<55 || y>565){
        return true;
    }

    const fs=rooms[room].furniture;

    for(const f of fs){

        if(
            x>f.x-10 &&
            x<f.x+f.w+10 &&
            y>f.y-10 &&
            y<f.y+f.h+10
        ){
            return true;
        }

    }

    return false;
}


/* =========================================================
   UPDATE
========================================================= */

function update(){

    if(endingStarted) return;

    let dx=0;
    let dy=0;

    if(keys["w"]||keys["arrowup"]) dy--;
    if(keys["s"]||keys["arrowdown"]) dy++;
    if(keys["a"]||keys["arrowleft"]) dx--;
    if(keys["d"]||keys["arrowright"]) dx++;

    if(dx&&dy){

        dx*=.707;
        dy*=.707;

    }

    const nx=player.x+dx*player.speed;
    const ny=player.y+dy*player.speed;

    if(!blocked(nx,player.y)){
        player.x=nx;
    }

    if(!blocked(player.x,ny)){
        player.y=ny;
    }


    if(player.x>970){

        enterRight();

    }

    if(player.x<30){

        enterLeft();

    }


    if(messageTimer>0){

        messageTimer--;

    }

}


/* =========================================================
   INTERACTION
========================================================= */

function interact(){

    if(
        !document.getElementById("dialog").classList.contains("hidden") ||
        !document.getElementById("drawingPanel").classList.contains("hidden") ||
        !document.getElementById("wirePanel").classList.contains("hidden")
    ){
        return;
    }

    const os=rooms[room].objects;

    let nearest=null;
    let dist=9999;

    for(const o of os){

        const ox=o.x+o.w/2;
        const oy=o.y+o.h/2;

        const d=Math.hypot(
            player.x-ox,
            player.y-oy
        );

        if(d<dist){

            dist=d;
            nearest=o;

        }

    }

    if(nearest && dist<115){

        useObject(nearest.t);

    }else{

        showMessage("Nothing here responds.",2);

    }

}

/* =========================================================
   DRAWING MINI GAME
========================================================= */

const drawCanvas=document.getElementById("drawCanvas");
const dctx=drawCanvas.getContext("2d");

let drawing=false;

function prepareDrawing(){

    dctx.fillStyle="#ddd";
    dctx.fillRect(0,0,drawCanvas.width,drawCanvas.height);

    dctx.strokeStyle="#111";
    dctx.lineWidth=7;
    dctx.lineCap="round";
    dctx.lineJoin="round";

}

function drawingPosition(e){

    const r=drawCanvas.getBoundingClientRect();

    let x;
    let y;

    if(e.touches){

        x=e.touches[0].clientX;
        y=e.touches[0].clientY;

    }else{

        x=e.clientX;
        y=e.clientY;

    }

    return{
        x:(x-r.left)*(drawCanvas.width/r.width),
        y:(y-r.top)*(drawCanvas.height/r.height)
    };

}

drawCanvas.addEventListener("pointerdown",e=>{

    drawing=true;

    const p=drawingPosition(e);

    dctx.beginPath();
    dctx.moveTo(p.x,p.y);

});

drawCanvas.addEventListener("pointermove",e=>{

    if(!drawing) return;

    const p=drawingPosition(e);

    dctx.lineTo(p.x,p.y);
    dctx.stroke();

});

drawCanvas.addEventListener("pointerup",()=>{
    drawing=false;
});

drawCanvas.addEventListener("pointercancel",()=>{
    drawing=false;
});


function openDrawing(){

    document.getElementById("drawingPanel")
        .classList.remove("hidden");

    prepareDrawing();

}

function closeDrawing(){

    document.getElementById("drawingPanel")
        .classList.add("hidden");

}

function clearDrawing(){

    prepareDrawing();

}

function finishDrawing(){

    faceFinished=true;
    clues++;

    closeDrawing();

`YOU FINISHED CHARACTER 03.

The drawing is placed
inside the unfinished frame.

For a moment...

the character's eyes
seem to move.

Then it says:

"THANK YOU."`,
7);

}


/* =========================================================

========================================================= */

const wireCanvas=document.getElementById("wireCanvas");
const wctx=wireCanvas.getContext("2d");

const wireColors=[
    "#e44",
    "#4ae",
    "#5d5",
    "#e5c"
];

let wireConnections=[null,null,null,null];
let selectedWire=-1;

const leftSockets=[
    {x:120,y:70},
    {x:120,y:150},
    {x:120,y:230},
    {x:120,y:310}
];

const rightSockets=[
    {x:680,y:310},
    {x:680,y:70},
    {x:680,y:230},
    {x:680,y:150}
];

function drawWires(){

    wctx.clearRect(
        0,
        0,
        wireCanvas.width,
        wireCanvas.height
    );

    wctx.fillStyle="#111";
    wctx.fillRect(
        0,
        0,
        wireCanvas.width,
        wireCanvas.height
    );

    wctx.font="16px monospace";
    wctx.textAlign="center";


    /* labels */

    wctx.fillStyle="#aaa";
    wctx.fillText(
        "SOURCE",
        120,
        30
    );

    wctx.fillText(
        "OUTPUT",
        680,
        30
    );


    /* connections */

    for(let i=0;i<4;i++){

        const target=wireConnections[i];

        if(target!==null){

            const a=leftSockets[i];
            const b=rightSockets[target];

            wctx.strokeStyle=wireColors[i];
            wctx.lineWidth=8;

            wctx.beginPath();

            wctx.moveTo(a.x,a.y);

            wctx.bezierCurveTo(
                300,
                a.y,
                500,
                b.y,
                b.x,
                b.y
            );

            wctx.stroke();

        }

    }


    /* sockets */

    for(let i=0;i<4;i++){

        const a=leftSockets[i];

        wctx.fillStyle=wireColors[i];
