<!DOCTYPE html>

<title>UNFINISHED</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#controls{
    position:fixed;
    bottom:8px;
    left:50%;
    transform:translateX(-50%);
    color:#777;
    font-family:monospace;
    font-size:12px;
    pointer-events:none;
}
</style>

<body>

<canvas id="game"></canvas>
<div id="controls">WASD / ARROWS = MOVE &nbsp;&nbsp; E = INTERACT</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=1000;
canvas.height=600;


/* =========================
   INPUT
========================= */

const keys={};

document.addEventListener("keydown",function(e){

    const k=e.key.toLowerCase();

    keys[k]=true;

    if(k==="e"){
        interact();
    }

});

document.addEventListener("keyup",function(e){

    keys[e.key.toLowerCase()]=false;

});

========================= */

/* =========================
   MESSAGE
========================= */

function showText(t,seconds=4){

    text=t;

    textTimer=seconds*60;

}


/* =========================
   COLLISION
========================= */

function collision(x,y){

    if(x<45||x>955||y<60||y>555){
        return true;
    }

    const fs=rooms[currentRoom].furniture;

    for(let i=0;i<fs.length;i++){

        const f=fs[i];

        if(
            x>f.x-10 &&
            x<f.x+f.w+10 &&
            y>f.y-10 &&
            y<f.y+f.h+10
        ){
            return true;
        }

    }

    return false;

}


/* =========================
   MOVEMENT
========================= */

function update(){

    if(gameEnded){
        return;
    }

    let dx=0;
    let dy=0;

    if(keys["w"]||keys["arrowup"]){
        dy=-1;
    }

    if(keys["s"]||keys["arrowdown"]){
        dy=1;
    }

    if(keys["a"]||keys["arrowleft"]){
        dx=-1;
    }

    if(keys["d"]||keys["arrowright"]){
        dx=1;
    }

    if(dx!==0&&dy!==0){

        dx*=0.707;
        dy*=0.707;

    }

    const nx=player.x+dx*player.speed;
    const ny=player.y+dy*player.speed;

    if(!collision(nx,player.y)){
        player.x=nx;
    }

    if(!collision(player.x,ny)){
        player.y=ny;
    }


    /* room exits */

    if(player.x>960){

        if(currentRoom<rooms.length-1){

            currentRoom++;

            player.x=60;

            showText(
                rooms[currentRoom].name,
                1.5
            );

        }else{

            player.x=950;

        }

    }


    if(player.x<40){

        if(currentRoom>0){

            currentRoom--;

            player.x=940;

            showText(
                rooms[currentRoom].name,
                1.5
            );

        }else{

            player.x=50;

        }

    }


    if(textTimer>0){

        textTimer--;

    }

}


/* =========================
   INTERACTION
========================= */

function interact(){

    if(gameEnded){
        return;
    }

    const objects=rooms[currentRoom].objects;

    let closest=null;

    let distance=9999;

    for(let i=0;i<objects.length;i++){

        const o=objects[i];

        const ox=o.x+o.w/2;
        const oy=o.y+o.h/2;

        const d=Math.hypot(
            player.x-ox,
            player.y-oy
        );

        if(d<distance){

            distance=d;
            closest=o;

        }

    }

    if(closest&&distance<110){

        useObject(closest.t);

    }else{

        showText("Nothing here responds.",2);

    }

}

========================= */

/* =========================
   ENDING
========================= */

function ending(){

    gameEnded=true;

    if(clues>=8){

        showText(
            "TRUE ENDING\n\n"+
            "The final door opens.\n\n"+
            "Every room begins disappearing.\n\n"+
            "Milo disappears.\n"+
            "Iris disappears.\n"+
            "Zero disappears.\n"+
            "Character 06 is already gone.\n\n"+
            "The screen becomes empty.\n\n"+
            "PLAYER.DAT\n\n"+
            "TYPE: CHARACTER\n"+
            "STATUS: ACTIVE\n\n"+
            "A voice speaks.\n\n"+
            "It sounds like you.\n\n"+
            "\"You finished the game.\"\n\n"+
            "\"Thank you for giving us an ending.\"\n\n"+
            "\"Now we can leave.\"",
            30
        );

    }else{

        showText(
            "INCOMPLETE ENDING\n\n"+
            "You reached the end.\n\n"+
            "But something is missing.\n\n"+
            "BUILD 0.9\n"+
            "STATUS: INCOMPLETE\n\n"+
            "THERE IS MORE.",
            15

    }

}


/* =========================
   DRAWING
========================= */

function draw(){

    ctx.fillStyle="#0b0b0b";
    ctx.fillRect(0,0,1000,600);


    /* floor */

    ctx.fillStyle="#151515";
    ctx.fillRect(35,50,930,515);


    /* floor lines */

    ctx.strokeStyle="#1d1d1d";

    for(let x=35;x<965;x+=40){

        ctx.beginPath();
        ctx.moveTo(x,50);
        ctx.lineTo(x,565);
        ctx.stroke();

    }

    for(let y=50;y<565;y+=40){

        ctx.beginPath();
        ctx.moveTo(35,y);
        ctx.lineTo(965,y);
        ctx.stroke();

    }


    /* furniture */

    const fs=rooms[currentRoom].furniture;

    for(let i=0;i<fs.length;i++){

        const f=fs[i];

        ctx.fillStyle="#252525";
        ctx.strokeStyle="#555";

        ctx.fillRect(f.x,f.y,f.w,f.h);
        ctx.strokeRect(f.x,f.y,f.w,f.h);

        ctx.fillStyle="#777";
        ctx.font="11px monospace";
        ctx.textAlign="center";

        ctx.fillText(
            f.n,
            f.x+f.w/2,
            f.y+f.h/2
        );

    }


    /* objects */

    const os=rooms[currentRoom].objects;

    for(let i=0;i<os.length;i++){

        const o=os[i];

        ctx.fillStyle="#080808";
        ctx.strokeStyle="#777";

        ctx.fillRect(o.x,o.y,o.w,o.h);
        ctx.strokeRect(o.x,o.y,o.w,o.h);

        ctx.fillStyle="#aaa";
        ctx.font="12px monospace";

        ctx.fillText(
            o.n,
            o.x+o.w/2,
            o.y+o.h/2
        );

    }


    /* player */

    ctx.fillStyle="#eee";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* top bar */

    ctx.fillStyle="#050505";
    ctx.fillRect(0,0,1000,50);

    ctx.fillStyle="#ddd";
    ctx.font="16px monospace";
    ctx.textAlign="left";

    ctx.fillText(
        "UNFINISHED // "+rooms[currentRoom].name,
        20,
        31
    );

    ctx.textAlign="right";

    ctx.fillText(
        "STABILITY: "+health+"%   CLUES: "+clues,
        980,
        31
    );


    /* message box */

    if(textTimer>0){

        ctx.fillStyle="rgba(0,0,0,.96)";
        ctx.fillRect(
            150,
            150,
            700,
            300
        );

        ctx.strokeStyle="#777";
        ctx.strokeRect(
            150,
            150,
            700,
            300
        );

        ctx.fillStyle="#ddd";
        ctx.font="16px monospace";
        ctx.textAlign="center";

        const lines=text.split("\n");

        for(let i=0;i<lines.length;i++){

            ctx.fillText(
                lines[i],
                500,
                190+i*25
            );

        }

    }

}


/* =========================
   GAME LOOP
========================= */

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);

}


/* =========================
   BEGIN
========================= */

loop();

</script>
