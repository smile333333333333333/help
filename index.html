    const key = e.key.toLowerCase();

    keys[key] = true;

    if(
        key === "w" ||
        key === "a" ||
        key === "s" ||
        key === "d" ||
        key === "e" ||
        key.startsWith("arrow")
    ){
        e.preventDefault();
    }

    if(key === "e"){
        interact();
    }

    if(key === "escape"){
        closeDialog();
    }
});

/* =========================================================
   BASIC FUNCTIONS
   ========================================================= */

function room(){
    return rooms[game.room];
}


function message(text,time=2500){

    const el=document.getElementById("message");

    el.textContent=text;
    el.style.display="block";

    clearTimeout(game.messageTimer);

    game.messageTimer=setTimeout(function(){
        el.style.display="none";
    },time);
}


function clue(){

    game.clues++;

    message("ARG CLUE FOUND",1800);
}


function dialog(title,text,buttons=[]){

    document.getElementById("dialogTitle").textContent=title;
    document.getElementById("dialogText").textContent=text;

    const box=document.getElementById("dialogButtons");

    box.innerHTML="";

    buttons.forEach(function(b){

        const button=document.createElement("button");

        button.textContent=b.text;

        button.onclick=function(){

            closeDialog();

            if(b.action){
                b.action();
            }

        };

        box.appendChild(button);

    });

    document.getElementById("dialog").style.display="block";
}


function closeDialog(){

    document.getElementById("dialog").style.display="none";

}


/* =========================================================
   MOVEMENT
   ========================================================= */

function blocked(x,y){

    if(x<35 || x>965 || y<65 || y>565){
        return true;
    }

    const list=room().furniture;

    for(let i=0;i<list.length;i++){

        const f=list[i];

        if(
            x>f[0]-12 &&
            x<f[0]+f[2]+12 &&
            y>f[1]-12 &&
            y<f[1]+f[3]+12
        ){
            return true;
        }
    }

    return false;
}


function move(){

    if(
        document.getElementById("dialog").style.display==="block" ||
        game.ending
    ){
        return;
    }

    let dx=0;
    let dy=0;

    if(keys["w"] || keys["arrowup"]) dy--;
    if(keys["s"] || keys["arrowdown"]) dy++;
    if(keys["a"] || keys["arrowleft"]) dx--;
    if(keys["d"] || keys["arrowright"]) dx++;

    if(dx!==0 && dy!==0){
        dx*=0.707;
        dy*=0.707;
    }

    const nx=player.x+dx*player.speed;
    const ny=player.y+dy*player.speed;

    if(!blocked(nx,player.y)){
        player.x=nx;
    }

    if(!blocked(player.x,ny)){
        player.y=ny;
    }

    checkExit();
    monster();
}


/* =========================================================
   EXITS
   ========================================================= */

function checkExit(){

    const exits=room().exits;

    for(let i=0;i<exits.length;i++){

        const e=exits[i];

        if(
            player.x>e.x &&
            player.x<e.x+e.w &&
            player.y>e.y &&
            player.y<e.y+e.h
        ){

            if(e.to===7 && !game.truth){

                message("The final door is locked.");

                player.x=880;

                return;
            }

            changeRoom(e.to);

            return;
        }
    }
}


function changeRoom(id){

    game.room=id;

    if(id===0){
        player.x=100;
    }else{
        player.x=900;
    }

    player.y=300;

    game.monsterActive=false;

    message(room().name,1200);
}


/* =========================================================
   INTERACTION
   ========================================================= */

function nearestObject(){

    const list=room().objects;

    let best=null;
    let bestDistance=9999;

    for(let i=0;i<list.length;i++){

        const o=list[i];

        const cx=o[0]+o[2]/2;
        const cy=o[1]+o[3]/2;

        const dx=player.x-cx;
        const dy=player.y-cy;

        const d=Math.sqrt(dx*dx+dy*dy);

        if(d<bestDistance){

            bestDistance=d;
            best=o;
        }
    }

    if(bestDistance<100){
        return best;
    }

    return null;
}


function interact(){

    if(document.getElementById("dialog").style.display==="block"){
        return;
    }

    const obj=nearestObject();

    if(!obj){

        message("Nothing here responds.");

        return;
    }

    const type=obj[5];

    if(type==="board") board();
    if(type==="box") box();
    if(type==="generator") generator();
    if(type==="warning") warning();
    if(type==="drawing") drawing();
    if(type==="frame") frame();
    if(type==="bench") bench();
    if(type==="files") files();
    if(type==="tape") tape();
    if(type==="computer") computer();
    if(type==="milo") milo();
    if(type==="iris") iris();
    if(type==="test") test();
    if(type==="window") windowClue();
    if(type==="zero") zero();
    if(type==="desk") desk();
    if(type==="devcomputer") devcomputer();
    if(type==="note") finalNote();
    if(type==="six") characterSix();
    if(type==="final") finalDoor();
}
