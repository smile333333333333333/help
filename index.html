/* =========================================================
   UTILITY
========================================================= */

function currentRoom(){
    return rooms[game.room];
}

function showMessage(text,time=2500){

    const el=document.getElementById("message");

    el.textContent=text;
    el.style.display="block";

    clearTimeout(showMessage.timer);

    showMessage.timer=setTimeout(()=>{
        el.style.display="none";
    },time);
}

function addClue(text){

    if(!game.clues.includes(text)){

        game.clues.push(text);

        showMessage("ARG CLUE FOUND");

        console.log(
            "[ARG CLUE]",
            text
        );
    }
}

function healthChange(amount){

    game.health+=amount;

    if(game.health<0)
        game.health=0;

    if(game.health>100)
        game.health=100;

    if(game.health<=0)
        die();
}


/* =========================================================
   OVERLAY
========================================================= */

function openOverlay(title,text,buttons=[]){

    document.getElementById("panelTitle").textContent=title;
    document.getElementById("panelText").textContent=text;

    const box=document.getElementById("buttons");

    box.innerHTML="";

    buttons.forEach(b=>{

        const button=document.createElement("button");

        button.textContent=b.text;

        button.onclick=()=>{

            closeOverlay();

            b.action();

        };

        box.appendChild(button);

    });

    document.getElementById("overlay").style.display="flex";
}

function closeOverlay(){

    document.getElementById("overlay").style.display="none";

}


/* =========================================================
   ROOM CHANGE
========================================================= */

function changeRoom(id){

    game.room=id;

    game.player.x=
        id===0 ? 130 : 820;

    game.player.y=320;

    game.shake=0;

    if(id===5 && game.flags.prototype){

        showMessage(
            "Something is moving in the testing area..."
        );

    }

    if(id===7){

        game.player.x=150;

        game.player.y=320;

    }

}


/* =========================================================
   COLLISION
========================================================= */

function solidFurniture(f){

    return true;
}

function circleRectCollision(px,py,r,rect){

    const nearestX=Math.max(
        rect.x,
        Math.min(px,rect.x+rect.w)
    );

    const nearestY=Math.max(
        rect.y,
        Math.min(py,rect.y+rect.h)
    );

    const dx=px-nearestX;
    const dy=py-nearestY;

    return dx*dx+dy*dy<r*r;
}


function canMove(x,y){

    const room=currentRoom();

    if(x<25 || x>975 || y<55 || y>555)
        return false;

    for(const f of room.furniture){

        if(circleRectCollision(
            x,y,game.player.r+3,f
        )){
            return false;
        }

    }

    return true;
}


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(){

    if(
        document.getElementById("overlay").style.display==="flex"
    ){
        return;
    }

    let dx=0;
    let dy=0;

    if(keys.w || keys.arrowup)
        dy-=game.player.speed;

    if(keys.s || keys.arrowdown)
        dy+=game.player.speed;

    if(keys.a || keys.arrowleft)
        dx-=game.player.speed;

    if(keys.d || keys.arrowright)
        dx+=game.player.speed;

    if(dx!==0 && dy!==0){

        dx*=.707;
        dy*=.707;

    }

    if(canMove(
        game.player.x+dx,
        game.player.y
    )){
        game.player.x+=dx;
    }

    if(canMove(
        game.player.x,
        game.player.y+dy
    )){
        game.player.y+=dy;
    }

    checkExits();
    checkPrototype();

}


/* =========================================================
   EXITS
========================================================= */

function checkExits(){

    const room=currentRoom();

    for(const exit of room.exits){

        if(circleRectCollision(
            game.player.x,
            game.player.y,
            game.player.r,
            exit
        )){

            if(exit.to===7){

                if(
                    game.room===6 &&
                    game.flags.truth
                ){

                    changeRoom(7);

                    showMessage(
                        "The final room is waiting."
                    );

                }else{

                    showMessage(
                        "The door is locked."
                    );

                }

            }else{

                changeRoom(exit.to);

            }

            return;

        }

    }

}


/* =========================================================
   PROTOTYPE
========================================================= */

function checkPrototype(){

    if(
        game.room!==5 ||
        !game.flags.prototype
    ) return;

    const target={
        x:850,
        y:470
    };

    const dx=game.player.x-target.x;
    const dy=game.player.y-target.y;

    const dist=Math.sqrt(dx*dx+dy*dy);

    if(dist<180){

        game.health-=.15;

        game.shake=3;

        if(Math.random()<.02){

            showMessage(
                "IT KNOWS WHERE YOU ARE."
            );

        }

        healthChange(0);

    }

}


/* =========================================================
   INTERACTION
========================================================= */

function interactNearby(){

    if(
        document.getElementById("overlay").style.display==="flex"
    ) return;

    const room=currentRoom();

    let closest=null;
    let distance=Infinity;

    for(const obj of room.objects){

        const cx=obj.x+obj.w/2;
        const cy=obj.y+obj.h/2;

        const dx=game.player.x-cx;
        const dy=game.player.y-cy;

        const d=Math.sqrt(dx*dx+dy*dy);

        if(d<distance){

            distance=d;
            closest=obj;

        }

    }

    if(closest && distance<90){

        interact(closest.type);

    }else{

        showMessage(
            "Nothing here responds."
        );

    }

}
